# Upptime (https://upptime.js.org) — page de statut publique DataFreak
# Règles : uniquement des URLs déjà publiques (*.datafreak.fr, sites Webflow,
# SFTP clients). Jamais d'URL interne *.freaklabs.fr, jamais de chemin porteur
# de secret (webhooks n8n réels, tokens). La supervision fine (1 min, alertes)
# reste au blackbox du cluster + Cockpit ; cette page est la vitrine (5 min).
owner: GitDFreak
repo: status
user-agent: GitDFreak-status

sites:
  - name: Site DataFreak
    url: https://www.datafreak.fr
  - name: Site FreakLabs
    url: https://freaklabs.io
  - name: Webhooks n8n
    # Chemin volontairement inexistant : n8n répond 404 quand le service est
    # disponible. Ne jamais sonder un webhook réel (déclencherait le workflow
    # et publierait son chemin).
    url: https://n8n.datafreak.fr/webhook/status-probe
    expectedStatusCodes: [404]
  - name: CDN assets
    # Bucket public sans listing : 403 sur la racine = edge + policy répondent.
    url: https://assets.datafreak.fr/
    expectedStatusCodes: [403]
  - name: FAQ (centre d'aide)
    # Hébergé par Zendesk : redirection vers /hc, 403 possible pour un client
    # non-navigateur. On valide la chaîne DNS + TLS + front Zendesk.
    url: https://faq.datafreak.fr
    expectedStatusCodes: [200, 301, 302, 403]
  - name: SFTP (dépôt de fichiers)
    check: "tcp-ping"
    url: sftp.freaklabs.fr
    port: 22

status-website:
  cname: status.datafreak.fr
  logoUrl: https://cdn.prod.website-files.com/68a34db27e193e45ab14a309/690f77b10cc6cca6fec37892_logotype-red.svg
  name: Statut DataFreak
  introTitle: "État des services **DataFreak**"
  introMessage: "Disponibilité et temps de réponse de nos services publics, mesurés toutes les 5 minutes depuis l'extérieur de notre infrastructure. Les incidents sont publiés sur cette page. Besoin d'aide ? [Centre d'aide](https://faq.datafreak.fr) · [Site DataFreak](https://www.datafreak.fr)"
  navbar:
    - title: Statut
      href: /
    - title: DataFreak
      href: https://www.datafreak.fr
    - title: Centre d'aide
      href: https://faq.datafreak.fr
  theme: light

# Métadonnées du dépôt gérées à la main (évite la permission « Administration »
# sur le token GH_PAT à grain fin).
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

assignees:
  - Bahmutopi

