# Barres « 1 jour = 1 barre » du thème Datafreak : précalcule assets/status-days.json
# à partir des incidents Upptime (issues), puis relance Static Site CI.
# Les couleurs ne peuvent changer qu'au passage de minuit (Paris) ou sur un événement
# d'incident : ce sont les seuls déclencheurs (jamais `push`, pour ne pas s'auto-déclencher).
# Workflow custom : le mécanisme update-template d'Upptime ne supprime que ses propres fichiers.
name: Status Days
on:
  schedule:
    - cron: "5 22 * * *" # 00:05 Paris (heure d'été)
    - cron: "5 23 * * *" # 00:05 Paris (heure d'hiver) — l'autre run est un no-op
  issues:
    types: [opened, closed, reopened, labeled, edited]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  actions: write # déclenche Static Site CI (workflow_dispatch)
concurrency:
  group: ${{ github.repository }}-status-days
  cancel-in-progress: false
jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Tests synthétiques
        run: node scripts/status-days.mjs --test
      - name: Calcul des jours
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/status-days.mjs
      - name: Commit si changement
        id: commit
        run: |
          if git diff --quiet -- assets/status-days.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "aucun changement"; exit 0
          fi
          git config user.name "datafreak-status[bot]"
          git config user.email "status@datafreak.fr"
          git add assets/status-days.json
          git commit -m ":bar_chart: Update status days [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild du site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Un push fait avec GITHUB_TOKEN ne déclenche pas `on: push` ; workflow_dispatch, si.
        run: gh workflow run site.yml --ref "${{ github.event.repository.default_branch }}"
